openapi: 3.0.3
info:
  title: IQA Backend API
  version: 0.0.1
  description: 图像质量评估 API。
servers:
  - url: http://localhost:8080
paths:
  /auth/sign-up:
    post:
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAuthTokenResponse"
  /auth/login:
    post:
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAuthTokenResponse"
  /auth/refresh:
    post:
      summary: 刷新AccessToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAuthTokenResponse"
  /assess:
    post:
      summary: 单张图片评估
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePredictResult"
  /assess/batch:
    post:
      summary: 多张图片评估
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseBatchPredictResponse"
  /assess/history:
    get:
      summary: 查询当前用户图片评估历史
      description: 分页查询当前登录用户的历史记录. page从1开始.
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - name: page
          in: query
          required: false
          description: 页码, 从1开始.
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: 每页条数.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePageAssessRecord"
components:
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: 访问令牌. 在Apifox中请使用全局变量{{token}}.
      schema:
        type: string
      example: "{{token}}"
  schemas:
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
      required:
        - accessToken
        - tokenType
        - expiresIn
    ResponseAuthTokenResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthTokenResponse"
      required:
        - code
        - message
    ResponsePredictResult:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PredictResult"
      required:
        - code
        - message
    ResponseBatchPredictResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/BatchPredictResponse"
      required:
        - code
        - message
    ResponsePageAssessRecord:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageAssessRecord"
      required:
        - code
        - message
    PredictResult:
      type: object
      properties:
        fileName:
          type: string
        qualityScore:
          type: number
          format: float
        scene:
          type: integer
          format: int32
          description: 场景分类编码.
        distortion:
          type: integer
          format: int32
          description: 失真分类编码.
    BatchPredictResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PredictResult"
    AssessRecord:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        filename:
          type: string
        base64:
          type: string
          description: 压缩后图片的Base64字符串.
        assessTime:
          type: string
          format: date-time
    PageAssessRecord:
      type: object
      description: MyBatis-Plus分页结果.
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AssessRecord"
        total:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        current:
          type: integer
          format: int64
        pages:
          type: integer
          format: int64

