    AssessBatchSseStream:
      type: string
      description: |
        SSE消息体. 事件通过event字段区分, data为JSON对象.
        start/progress: message, progress, total, completed.
        result: message, progress, total, completed, currentFileName, predictResult.
        completed: message, progress, total, completed, results.
        error: message.
      example: |
        event: start
        data: {"message":"批量评估任务开始","progress":0,"total":3}

        event: progress
        data: {"message":"模型批量评估中","progress":20,"total":3}

        event: result
        data: {"message":"已完成单张评估","currentFileName":"a.jpg","progress":33,"total":3,"completed":1,"predictResult":{"file_name":"a.jpg","quality_score":0.92,"scene":1,"distortions":[{"index":3,"prob":0.4213}]}}

        event: completed
        data: {"message":"批量评估完成","progress":100,"total":3,"completed":3,"results":[]}
