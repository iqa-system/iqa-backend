spring:
  application:
    name: iqa-backend
  datasource:
    url: jdbc:mysql://localhost:3306/iqa_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&jdbcCompliantTruncation=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # 邮件配置, 使用了山大云邮账号
  mail:
    host: smtphz.qiye.163.com
    port: 465
    username: 202200300334@mail.sdu.edu.cn
    password: dtMXSEgcWT$#2NDr
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    ssl:
      enabled: true

server:
  port: 8080
  servlet:
    # 设置响应编码格式强制为UTF-8, 否则过滤器/拦截器中通过打印流直接响应中文时前端会收到乱码
    encoding:
      charset: UTF-8
      force: true
model-api:
  base-url: http://localhost:8000

# user.dir是JVM系统属性, 代表当前 JVM 进程启动时的工作目录, 通常是项目根目录, 但也可能因运行环境不同而有所变化
file-storage:
  root-dir: ${user.dir}/upload

# JWT
jwt:
  secret-key:
    # jjwt的秘钥不允许太短
    access-token: 3q4-jb!@-$%@(%vgUYT&:s-dbehj@AWDnwadamf
  expiration:
    # 单位为秒
    access-token: 432000 # 5天

# 找回密码配置
password-reset:
  # 验证码过期时间, 单位为秒
  code-expiration-seconds: 600
  # 验证码发送冷却时间, 单位为秒
  send-cooldown-seconds: 60
  max-attempts: 5
