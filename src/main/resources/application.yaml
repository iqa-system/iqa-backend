spring:
  application:
    name: iqa-backend
  datasource:
    url: jdbc:mysql://localhost:3306/iqa_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&jdbcCompliantTruncation=false
    username: iqa
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 150MB
    encoding:
      # 设置响应编码格式强制为UTF-8, 否则过滤器/拦截器中通过打印流直接响应中文时前端会收到乱码
      charset: UTF-8
      force: true
  # 邮件配置, 使用了山大云邮账号
  mail:
    host: smtphz.qiye.163.com
    port: 465
    username: 202200300334@mail.sdu.edu.cn
    password: dtMXSEgcWT$#2NDr
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    ssl:
      enabled: true

server:
  port: 8080
  tomcat:
    # 当multipart请求超过Spring配置的大小限制时, Tomcat默认可能在吞掉剩余请求体前直接关闭连接.
    # 设为-1表示不限制吞咽大小, 让Spring有机会返回413 JSON响应, 避免前端只看到ERR_CONNECTION_RESET.
    max-swallow-size: -1
    # multipart文件数量限制, 默认是10, 对于批量图像评估来说太小了
    max-part-count: 100

# Spring Boot Actuator运维端点配置.
# 生产环境只暴露健康检查和基础信息端点, 避免env/beans/heapdump等敏感端点被外部访问.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

model-api:
  base-url: http://localhost:8000

# user.dir是JVM系统属性, 代表当前 JVM 进程启动时的工作目录, 通常是项目根目录, 但也可能因运行环境不同而有所变化
file-storage:
  root-dir: ${user.dir}/upload

# JWT
jwt:
  secret-key:
    # jjwt的秘钥不允许太短
    access-token: 3q4-jb!@-$%@(%vgUYT&:s-dbehj@AWDnwadamf
  expiration:
    # 单位为秒
    access-token: 432000 # 5天

# 找回密码配置
password-reset:
  # 验证码过期时间, 单位为秒
  code-expiration-seconds: 600
  # 验证码发送冷却时间, 单位为秒
  send-cooldown-seconds: 60
  max-attempts: 5
