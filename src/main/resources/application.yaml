spring:
  application:
    name: iqa-backend
  datasource:
    url: jdbc:mysql://localhost:3306/iqa_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&jdbcCompliantTruncation=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8080
  servlet:
    # 设置响应编码格式强制为UTF-8, 否则过滤器/拦截器中通过打印流直接响应中文时前端会收到乱码
    encoding:
      charset: UTF-8
      force: true
model-api:
  base-url: http://localhost:8000

